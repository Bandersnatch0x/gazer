<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0f0c" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta
      name="description"
      content="A 1997 virtual pet game that was never a pet game. You raise a model."
    />
    <title>GAZER</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0f0c;
        color: #cfe8d5;
        /* 1997 chrome (GAME_REVIEW A5): the same bitmap-feel stack as
           theme.ts's --gazer-font. Keep the two in sync. */
        font: 12px/1.6 "MS Gothic", "Fixedsys", "DotGothic16", "MS Gothic", "Fixedsys", "DotGothic16", ui-monospace, monospace;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        contain: paint;
      }
      #canvas {
        image-rendering: pixelated;
        max-width: 100vw;
        max-height: 100vh;
        background: #0a0f0c;
        display: block;
        /* Own compositor layer. Without this, opening a fixed-position panel
           makes Chromium re-composite the canvas and briefly paint an
           uninitialised rectangle above it. */
        transform: translateZ(0);
        will-change: transform;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 12px;
        white-space: pre;
        opacity: 0.7;
        pointer-events: none;
        /* Text surfaces ride ABOVE the CRT scanlines (user feedback: the
           overlay crushed small text): the scanlines keep their mood on the
           scene, the words stay crisp. */
        z-index: 50;
      }
      #ui {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        pointer-events: none;
        z-index: 50;
      }
      /* N1(票 0040):plain `#ui > *` (specificity 1-0-0) overrode the HUD
         strip's own pointer-events:none (0-1-0), turning the whole full-width
         strip into a click-eating layer that buried the bezel buttons. The
         strip keeps its none intent (playtest p1 finding F3); only the real
         widgets stay clickable. */
      #ui > *:not(.gazer-hud) {
        pointer-events: auto;
      }
      .gazer-hud {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: auto;
        /* 0081: 一行反馈纸——空对话收成单行提示（theme.ts 同步），不再让
           空转录占走 1/3 视高。 */
        padding: 0 12px 10px;
        /* The HUD strip spans the full width but only its real widgets take
           clicks (playtest p1 finding F3): the strip itself must never eat
           canvas taps aimed at floor tiles near the bottom. */
        pointer-events: none;
      }
      .gazer-hud > * {
        pointer-events: auto;
      }
      /* Same discipline one level down: the mount spans full width, the
         terminal box itself is the only part that takes clicks. */
      .gazer-dialogue-mount {
        pointer-events: none;
      }
      .gazer-dialogue-mount > * {
        pointer-events: auto;
      }
      /* Controls sit top-right so no panel can ever cover them. */
      .gazer-bar {
        position: fixed;
        top: 8px;
        right: 12px;
        z-index: 20;
        display: flex;
        gap: 8px;
      }
      .gazer-key {
        background: transparent;
        color: #cfe8d5;
        border: 1px solid #2a322a;
        font: 11px/1 "MS Gothic", "Fixedsys", "DotGothic16", ui-monospace, monospace;
        letter-spacing: 0.08em;
        padding: 6px 10px;
        cursor: pointer;
      }
      .gazer-key:hover,
      .gazer-key:focus-visible {
        border-color: #7ef0a6;
        outline: none;
      }
      .gazer-dialogue-mount {
        display: flex;
        justify-content: center;
        gap: 12px;
        align-items: flex-end;
      }
      /* 0081: an idle transcript is one quiet row pinned bottom-center, not a
         third of the viewport; content opens it back up. */
      .gazer-dialogue[data-empty] {
        border-color: transparent;
        background: transparent;
        max-height: none;
      }
      .gazer-dialogue[data-empty] .gazer-dialogue__bar {
        display: none;
      }
      .gazer-dialogue[data-empty] .gazer-dialogue__body {
        padding: 2px 6px;
        min-height: 0;
        opacity: 0.55;
      }
      /* The panel floats: opening it must never reflow the canvas container. */
      .gazer-panel {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 10;
        max-height: 60vh;
        width: min(30rem, calc(100vw - 24px));
        overflow: auto;
        background: #10130f;
        border: 1px solid #2a322a;
        padding: 8px;
        font-size: 11px;
        transform: translateZ(0);
        contain: layout paint;
      }
      .gazer-panel[hidden] {
        display: none;
      }
      /* 0081 reading mode: opening a panel dims the world so the archive is
         clearly the thing being read, not a card floating over a live scene. */
      body.gazer-reading #stage {
        opacity: 0.35;
        filter: saturate(0.65);
      }
      body.gazer-reading #canvas {
        pointer-events: none;
      }
      /* The archive is the whole screen: chrome that would sit on top of the
         text is hidden, and the panel's own exit key is the only way back. */
      body.gazer-reading #hud,
      body.gazer-reading .gazer-hud,
      body.gazer-reading .gazer-osd-bar {
        opacity: 0;
        pointer-events: none;
      }
      body.gazer-reading .gazer-panel {
        border-color: #4b5a4b;
        box-shadow: 0 0 0 9999px rgba(4, 8, 5, 0.55);
      }
      @media (max-width: 720px) {
        /* A phone reads an archive full-screen; the close key is the only exit. */
        body.gazer-reading .gazer-panel {
          inset: 0;
          width: auto;
          max-height: none;
          border: 0;
          padding: 12px;
          box-shadow: none;
        }
      }
      .gazer-form {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .gazer-panel__title {
        margin: 8px 0 4px;
        font: 12px/1.4 "MS Gothic", "Fixedsys", "DotGothic16", ui-monospace, monospace;
        letter-spacing: 0.12em;
        color: #ffb000;
      }
      .gazer-panel__note {
        margin: 0;
        color: #7d8f81;
        font-size: 11px;
      }
      .gazer-choice {
        display: flex;
        flex-direction: column;
        gap: 2px;
        text-align: left;
        background: transparent;
        color: #cfe8d5;
        border: 1px solid #2a322a;
        padding: 8px 10px;
        font: 11px/1.4 "MS Gothic", "Fixedsys", "DotGothic16", ui-monospace, monospace;
        cursor: pointer;
      }
      .gazer-choice:hover,
      .gazer-choice:focus-visible {
        border-color: #7ef0a6;
        outline: none;
      }
      .gazer-choice__label {
        letter-spacing: 0.08em;
      }
      .gazer-choice__note {
        color: #7d8f81;
      }
      .gazer-input {
        background: #0a0f0c;
        color: #cfe8d5;
        border: 1px solid #2a322a;
        padding: 8px 10px;
        font: 12px/1.4 "MS Gothic", "Fixedsys", "DotGothic16", ui-monospace, monospace;
      }
      .gazer-input:focus-visible {
        border-color: #7ef0a6;
        outline: none;
      }
      .gazer-pupil {
        width: 96px;
        height: 96px;
        image-rendering: pixelated;
        align-self: center;
        border: 1px solid #2a322a;
      }
      /* CRT framing (ART-CORE-04, ticket 0022): the LS-97 monitor shell.
         All layers are pre-baked canvases positioned by src/render/crt.ts;
         the frame itself never intercepts input except the boot screen and
         the two hardware hotspots. The frame drops an 8px soft shadow on the
         dark desk background (§2.1). */
      .gazer-crt-frame {
        position: absolute;
        z-index: 30;
        pointer-events: none;
        box-shadow: 0 8px 8px rgba(0, 0, 0, 0.55);
      }
      .gazer-crt-shell {
        position: absolute;
        inset: 0;
        image-rendering: pixelated;
      }
      .gazer-crt-glass {
        position: absolute;
        pointer-events: none;
        overflow: hidden;
      }
      .gazer-crt-fx,
      .gazer-crt-boot {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      .gazer-crt-led {
        position: absolute;
        image-rendering: pixelated;
      }
      /* The boot screen takes the skip tap; the framing layer stays
         click-through once the world is running. */
      .gazer-crt-boot {
        pointer-events: auto;
        cursor: pointer;
      }
      /* N1(票 0040):the hotspots live in the ROOT stacking context — the
         frame paints inside #stage{contain:paint}, whose own stacking context
         (z≈0) buries everything under #ui{z-index:50} no matter what z-index
         the buttons carry. The installer mounts them on <body> position:fixed,
         aligned onto the baked bezel slots; pointer-events:auto keeps them
         clickable above the HUD/terminal bottom edge. */
      .gazer-crt-hotspot {
        position: fixed;
        background: transparent;
        border: 0;
        padding: 0;
        margin: 0;
        cursor: pointer;
        pointer-events: auto;
        z-index: 60;
      }
      /* 票 0063 B1/B2:按钮条自身不吃点击,只有真按钮接输入;OSD 条挂到
         #ui{z-index:50} 之上。窄视口把 HUD / OSD / 按钮条拆成互不重叠的三行。 */
      .gazer-bar {
        pointer-events: none;
      }
      .gazer-bar > * {
        pointer-events: auto;
      }
      .gazer-osd-bar {
        position: fixed;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 60; /* > #ui 50:elementFromPoint 命中 OSD 自身 */
        display: flex;
        pointer-events: none;
      }
      .gazer-osd-bar > * {
        pointer-events: auto;
        /* 0081: the OSD toggle is a touch target too. */
        min-height: 44px;
        min-width: 44px;
      }
      @media (max-width: 720px) {
        /* 行 1(8..~32):OSD 钮;行 2(40..72):HUD;行 3(76+):7 个按钮折行。 */
        /* 0081: 世界贴控件下方;底部留给对话/反馈。整数缩放下世界尺寸固定,
           再居中只会把空区劈成两半,不如把世界与控件成组。 */
        #stage {
          place-items: start center;
          padding-top: 186px;
        }
        .gazer-osd-bar {
          top: 8px;
          left: auto;
          right: 12px;
          transform: none;
        }
        #hud {
          top: 40px;
          left: 12px;
          right: 12px;
          max-width: calc(100vw - 24px);
          white-space: pre-wrap;
          overflow-wrap: anywhere;
          max-height: 32px;
          overflow: hidden;
        }
        .gazer-hud > .gazer-bar {
          top: 76px;
          left: 12px;
          right: 12px;
          flex-wrap: wrap;
          justify-content: flex-end;
          gap: 8px;
          pointer-events: none;
        }
        .gazer-hud > .gazer-bar > .gazer-key {
          pointer-events: auto;
          /* 0081: 触控目标 ≥44×44、间距 ≥8,便于单手点中。 */
          min-height: 44px;
          min-width: 44px;
          padding: 10px 12px;
          font-size: 12px;
          letter-spacing: 0.04em;
        }
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="canvas"></canvas></div>
    <pre id="hud"></pre>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
